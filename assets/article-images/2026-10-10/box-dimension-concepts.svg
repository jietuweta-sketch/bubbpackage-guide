<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440"><rect width="1000" height="440" fill="#f6f8f3"/><g font-family="Microsoft YaHei,Arial" fill="#264736"><text x="40" y="50" font-size="26">同一个盒子，三个尺寸口径</text><rect x="90" y="130" width="290" height="195" rx="4" fill="#e2c99a" stroke="#896d48" stroke-width="3"/><rect x="114" y="154" width="242" height="147" fill="#fff" stroke="#896d48" stroke-width="2"/><path d="M114 176H356M90 343H380" stroke="#397252" stroke-width="3"/><text x="158" y="169" font-size="18">内部可用空间</text><text x="138" y="374" font-size="18">外部占用尺寸</text><text x="455" y="148" font-size="20">内尺寸：产品能否装入</text><text x="455" y="213" font-size="20">外尺寸：储运与配套空间</text><text x="455" y="278" font-size="20">展开尺寸：图稿与刀线范围</text><text x="455" y="343" font-size="17">展开尺寸须按结构确认，不能仅靠长宽高推算</text><text x="40" y="414" font-size="14">原创二维示意，非工程图；未标注比例，不用于生产或厚度计算。</text></g></svg>