<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="355" viewBox="0 0 1000 355"><rect width="1000" height="355" fill="#f6f8f0"/><g font-family="Microsoft YaHei,Arial" fill="#2c4d3b"><text x="35" y="48" font-size="26">结构线交接：线条含义与颜色分别说明</text><text x="35" y="88" font-size="16">原创概念示意，不是刀模图；颜色与虚实仅用于阅读，不是生产标准。</text><path d="M65 148H450" stroke="#a75d49" stroke-width="5"/><text x="500" y="156" font-size="22">裁线：说明需要切开的边界</text><path d="M65 218H450" stroke="#497753" stroke-width="5" stroke-dasharray="15 9"/><text x="500" y="226" font-size="22">压线：说明需要折叠的方向与位置</text><text x="35" y="300" font-size="17">接收方需要确认：线型、图层、命名与输出约定，不只看屏幕颜色。</text></g></svg>