<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330"><rect width="1000" height="330" fill="#f6f8f0"/><g font-family="Microsoft YaHei,Arial" fill="#2c503c"><text x="35" y="48" font-size="26">重复使用包装：需要跑通的返回路径</text><text x="35" y="87" font-size="16">编辑根据EEA循环使用资料绘制的概念示意，非具体项目或性能承诺。</text><rect x="35" y="130" width="210" height="96" rx="12" fill="#e1ebd9"/><text x="53" y="170" font-size="20">交付与使用</text><text x="53" y="202" font-size="16">明确使用者与用途</text><path d="M250 177h17l-6 -5m6 5l-6 5" stroke="#477954" fill="none" stroke-width="2"/><rect x="275" y="130" width="210" height="96" rx="12" fill="#e1ebd9"/><text x="293" y="170" font-size="20">回收与交接</text><text x="293" y="202" font-size="16">知道交到哪里</text><path d="M490 177h17l-6 -5m6 5l-6 5" stroke="#477954" fill="none" stroke-width="2"/><rect x="515" y="130" width="210" height="96" rx="12" fill="#e1ebd9"/><text x="533" y="170" font-size="20">检查与整理</text><text x="533" y="202" font-size="16">确认状态与责任</text><path d="M730 177h17l-6 -5m6 5l-6 5" stroke="#477954" fill="none" stroke-width="2"/><rect x="755" y="130" width="210" height="96" rx="12" fill="#e1ebd9"/><text x="773" y="170" font-size="20">再次投入使用</text><text x="773" y="202" font-size="16">记录周转与退出</text><text x="35" y="286" font-size="16">有容器不等于有闭环：返回、检查和再投入的环节需要一起规划。</text></g></svg>