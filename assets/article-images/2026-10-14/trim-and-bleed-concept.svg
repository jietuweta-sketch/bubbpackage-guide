<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><rect width="1000" height="400" fill="#f6f8f0"/><g font-family="Microsoft YaHei,Arial" fill="#2d4c39"><text x="35" y="46" font-size="26">裁切、外侧延伸与重要文字位置</text><text x="35" y="82" font-size="16">原创概念示意，不按比例，无生产尺寸；实际参数由生产方确认。</text><rect x="70" y="116" width="360" height="235" fill="#d8e7cc"/><rect x="94" y="140" width="312" height="187" fill="#f2e4c8" stroke="#ac5d45" stroke-width="3"/><rect x="120" y="166" width="260" height="135" fill="white" stroke="#3d6f55" stroke-dasharray="8 5" stroke-width="2"/><text x="156" y="242" font-size="22">重要内容示意</text><text x="500" y="154" font-size="20">红线：裁切边界的概念位置</text><text x="500" y="216" font-size="20">外侧：需要确认的背景延伸区域</text><text x="500" y="278" font-size="20">内侧：重要文字位置需另行确认</text><text x="500" y="337" font-size="16">图示不替代包装刀线、折线或印前要求。</text></g></svg>