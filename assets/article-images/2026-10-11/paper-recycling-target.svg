<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340"><rect width="1000" height="340" fill="#f5f8f0"/><g font-family="Microsoft YaHei,Arial" fill="#2c503c"><text x="38" y="47" font-size="26">欧洲纸回收：2025年实际值与2030年目标</text><text x="38" y="85" font-size="16">来源：Cepi / EPRC，2026-10-01发布。两项并非同一年数据。</text><text x="38" y="149" font-size="18">2025实际</text><rect x="185" y="121" width="611.2" height="42" fill="#437b58" rx="5"/><text x="815" y="149" font-size="22">76.4%</text><text x="38" y="229" font-size="18">2030目标</text><rect x="185" y="201" width="608" height="42" fill="#9cb78b" rx="5"/><text x="812" y="229" font-size="22">76%</text><text x="38" y="299" font-size="15">本站依据报告摘要绘制；比例为纸和纸板总体统计，不是单件包装的回收认证。</text></g></svg>